name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django-version: ['5.0', '5.1', '5.2']
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django==${{ matrix.django-version }}.*"
          pip install .
      - name: Run tests
        run: python runtests.py

  test-memcached:
    # The same suite against a real memcached. The job above uses locmem,
    # which only warns about keys memcached can't store; the memcached
    # backend rejects them, so key bugs fail here instead of passing quietly.
    runs-on: ubuntu-latest
    name: Python 3.12 / Django 5.2 / memcached
    services:
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    env:
      ARGCACHE_TEST_MEMCACHED: 127.0.0.1:11211
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django==5.2.*" pymemcache
          pip install .
      - name: Run tests
        run: python runtests.py
